<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎲 种子筛选器 · 高中生涯模拟器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#f7f4ea 0%,#eef3ec 100%);background-attachment:fixed;color:#2d3748;min-height:100vh;font-size:16px}
#app{max-width:560px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:26px;text-align:center;margin:10px 0 6px;letter-spacing:1px}
.sub{text-align:center;color:#718096;font-size:13.5px;margin-bottom:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 14px rgba(45,55,72,.08);margin-bottom:14px}
.row-label{font-size:13px;color:#718096;font-weight:600;margin:4px 0 8px}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;font-family:inherit}
.btn.primary{background:#2f855a;color:#fff;box-shadow:0 3px 10px rgba(47,133,90,.3)}
.btn.primary:active{background:#276749}
.btn.primary:disabled{opacity:.55;cursor:not-allowed}
.filter-select{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;font-family:inherit;background:#fff;outline:none;margin-bottom:6px;color:#2d3748}
.filter-select:focus{border-color:#2f855a}
.filter-progress{font-size:13px;color:#718096;margin:10px 0 4px;min-height:18px;line-height:1.5}
.filter-item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f7fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13.5px;line-height:1.6}
.use-btn{background:#2f855a;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.preset-chip{font-size:12.5px;background:#f0fff4;color:#276749;border:1.5px solid #c6f6d5;border-radius:20px;padding:4px 10px;cursor:pointer;font-family:inherit}
.footer-note{text-align:center;color:#a0aec0;font-size:12px;margin-top:26px;line-height:1.8}
</style>
</head>
<body>
<div id="app">
  <h1>🎲 种子筛选器</h1>
  <p class="sub">高中生涯模拟器 · 按目标结局批量搜索种子</p>
  <div class="card">
    <div class="row-label">🎯 常用目标(点击直接搜索)</div>
    <div class="preset-row" id="preset-row"></div>
    <div class="row-label">目标结局</div>
    <select class="filter-select" id="filter-ending"></select>
    <div class="row-label">选牌策略(决定按什么思路玩)</div>
    <select class="filter-select" id="filter-strategy"></select>
    <div class="row-label">出身与难度(不选则由种子自动轮换)</div>
    <select class="filter-select" id="filter-origin"></select>
    <select class="filter-select" id="filter-diff"></select>
    <div class="row-label">搜索种子数(从 1 开始递增)</div>
    <select class="filter-select" id="filter-count">
      <option value="1000">1000(快)</option>
      <option value="5000" selected>5000(推荐)</option>
      <option value="10000">10000(慢)</option>
      <option value="20000">20000(很慢,适合稀有结局)</option>
    </select>
    <button class="btn primary" id="btn-filter-run" style="margin-top:14px">🔍 开始筛选</button>
  </div>
  <div class="card" id="result-card">
    <div class="filter-progress" id="filter-progress">⬆️ 选好目标后点击「开始筛选」</div>
    <div id="filter-results"></div>
  </div>
  <p class="footer-note">每个种子用多种「选牌策略」模拟,任一策略达成目标即收录;也可以固定策略,例如「仅总选第一项/最后一项」——全程只点对应选项即可复现<br>点「📋 复制复现码」,把整串粘贴回游戏主页的「生涯种子」,会自动按该种子的出身与难度开局<br>同种子 + 同出身 + 同难度 + 同样思路 = 结果可复现<br>生成于 <span id="build-time">/*__BUILD_TIME__*/</span><br><a href="index.html" style="color:#718096">← 返回游戏主页</a></p>
</div>
<script>
/*__ENGINE__*/
// ============ 筛选器 UI(独立页面) ============
function byId(id){ return document.getElementById(id); }
function endingById(id){ for(var i=0;i<ENDINGS.length;i++) if(ENDINGS[i].id===id) return ENDINGS[i]; return {icon:'❓',name:id}; }
function originById(id){ for(var i=0;i<ORIGINS.length;i++) if(ORIGINS[i].id===id) return ORIGINS[i]; return {icon:'❓',name:id}; }
var runTimer = null;

function init(){
  var endOpts = '';
  ENDINGS.forEach(function(e){ endOpts += '<option value="'+e.id+'">'+e.icon+' '+e.name+'</option>'; });
  byId('filter-ending').innerHTML = endOpts;
  var originOpts = '<option value="">全部出身</option>';
  ORIGINS.forEach(function(o){ originOpts += '<option value="'+o.id+'">'+o.icon+' '+o.name+'</option>'; });
  byId('filter-origin').innerHTML = originOpts;
  var diffOpts = '<option value="">全部难度</option>';
  for(var k in DIFF){ diffOpts += '<option value="'+k+'">'+DIFF[k].icon+' '+DIFF[k].name+'</option>'; }
  byId('filter-diff').innerHTML = diffOpts;
  var stratOpts = '<option value="">全部策略(任一达成即收录)</option>'+
    '<option value="last">仅总选最后一项 ⭐ 最易复现</option>';
  PICK_STRATEGIES.forEach(function(s){
    if(s.id === 'last') return;
    stratOpts += '<option value="'+s.id+'">仅'+s.name+(s.id==='first' ? ' ⭐ 最易复现' : '')+'</option>';
  });
  byId('filter-strategy').innerHTML = stratOpts;
  var presets = [
    {id:'baosong'}, {id:'zhuangyuan'}, {id:'love'}, {id:'yiyu_dead'}, {id:'abroad_money'},
  ];
  var phtml = '';
  presets.forEach(function(p){
    var e = endingById(p.id);
    phtml += '<button class="preset-chip" data-id="'+p.id+'">'+e.icon+' '+e.name+'</button>';
  });
  byId('preset-row').innerHTML = phtml;
  byId('preset-row').querySelectorAll('.preset-chip').forEach(function(b){
    b.addEventListener('click', function(){
      byId('filter-ending').value = b.dataset.id;
      runFilter();
    });
  });
  byId('btn-filter-run').addEventListener('click', runFilter);
}

function runFilter(){
  if(runTimer){ clearTimeout(runTimer); runTimer = null; }
  var target = byId('filter-ending').value;
  var origin = byId('filter-origin').value;
  var diff = byId('filter-diff').value;
  var stratId = byId('filter-strategy').value;
  var total = parseInt(byId('filter-count').value, 10) || 5000;
  var prog = byId('filter-progress');
  var resBox = byId('filter-results');
  var runBtn = byId('btn-filter-run');
  runBtn.disabled = true;
  resBox.innerHTML = '';
  var strats = stratId ? PICK_STRATEGIES.filter(function(s){ return s.id === stratId; }) : PICK_STRATEGIES;
  var found = [];
  var i = 0;
  var t0 = Date.now();
  var CHUNK = 150;
  function step(){
    var end = Math.min(i + CHUNK, total);
    for(; i < end; i++){
      var seed = i + 1;
      var gOrigin = origin || ORIGINS[i % ORIGINS.length].id;
      var gDiff = diff || ['hard','normal','fast'][i % 3];
      for(var s=0; s<strats.length; s++){
        var st = strats[s];
        var g = createGame(seed, gDiff, gOrigin);
        var res = simGame(g, st.fn);
        if(res.ending === target){
          found.push({seed:seed, origin:gOrigin, diff:gDiff, score:res.score, strategy:st.name, strategyId:st.id});
          break;
        }
      }
    }
    prog.textContent = '🔍 已搜索 '+i+' / '+total+' 个种子 · 找到 '+found.length+' 个';
    if(i < total){
      runTimer = setTimeout(step, 0);
    } else {
      runBtn.disabled = false;
      prog.textContent = '✅ 搜索完成:'+total+' 个种子 · 找到 '+found.length+' 个 · 耗时 '+Math.round((Date.now()-t0)/100)/10+' 秒';
      if(found.length === 0){
        resBox.innerHTML = '<div class="filter-progress" style="color:#c53030">没有找到符合条件的种子,试试增大搜索量或放宽出身/难度</div>';
      } else {
        var e = endingById(target);
        var html = '';
        found.slice(0, 50).forEach(function(f){
          // 只有总选第一项/最后一项是人类能照着复现的;贪心/随机是脚本策略,仅作参考
          var replayable = (f.strategyId === 'first' || f.strategyId === 'last');
          html += '<div class="filter-item"><span><b>🎲 种子 '+f.seed+'</b> · '+originById(f.origin).icon+originById(f.origin).name+' · '+DIFF[f.diff].name+'<br>'+
            e.icon+' '+e.name+(f.score===null?' · 未能参加高考':' · 高考 '+f.score+' 分')+' · 策略:'+f.strategy+
            (replayable ? '' : ' ⚠️ 脚本策略,手动复现难')+'</span>'+
            '<button class="use-btn" data-spec="'+f.seed+'@'+f.origin+'@'+f.diff+'">📋 复制复现码</button></div>';
        });
        if(found.length > 50) html += '<div class="filter-progress">仅显示前 50 个</div>';
        resBox.innerHTML = html;
        resBox.querySelectorAll('.use-btn').forEach(function(b){
          b.addEventListener('click', function(){ copySpec(b.dataset.spec, b); });
        });
      }
    }
  }
  step();
}

// 复制复现码(种子@出身@难度),游戏主页的「生涯种子」可直接粘贴整串,自动按此出身与难度开局
function copySpec(spec, btn){
  function fallbackCopy(){
    var ta = document.createElement('textarea');
    ta.value = spec;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    done(ok);
  }
  function done(ok){
    btn.textContent = ok ? '✅ 已复制' : '复制失败,长按复制:'+spec;
    setTimeout(function(){ btn.textContent = '📋 复制复现码'; }, 1600);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(spec).then(function(){ done(true); }, fallbackCopy);
  } else { fallbackCopy(); }
}

init();
</script>
</body>
</html>
